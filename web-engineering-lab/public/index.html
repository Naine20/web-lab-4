<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Engineering Lab 04</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page">
    <header>
      <h1>Hello, World!</h1>

      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#schedule">Office Hours</a></li>
          <li><a href="#feedback">Send Feedback</a></li>
        </ul>
      </nav>
    </header>

    <section id="schedule">
      <h2 class="span-all">Office Hours</h2>

      <table>
        <caption>Weekly office hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Time</th>
            <th scope="col">Location</th>
            <th scope="col">Book</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row">Monday</th>
            <td>10:00-11:00</td>
            <td>Room 214</td>
            <td>
              <button type="button" data-day="Monday" aria-label="Select Monday">
                Select
              </button>
            </td>
          </tr>

          <tr>
            <th scope="row">Wednesday</th>
            <td>14:00-15:00</td>
            <td>Room 214</td>
            <td>
              <button type="button" data-day="Wednesday" aria-label="Select Wednesday">
                Select
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <figure>
        <span class="location-icon" aria-hidden="true">📍</span>
        <figcaption>All office hours are held in Room 214.</figcaption>
      </figure>

      <p id="status" role="status" class="span-all text-muted">
        No slots booked yet.
      </p>
    </section>

    <section id="feedback">
      <h2>Send Feedback</h2>

      <form>
        <p>
          <label for="name">Name</label>
          <input id="name" name="name" type="text">
        </p>

        <p>
          <label for="email">Email</label>
          <input id="email" name="email" type="email">
        </p>

        <fieldset class="span-all">
          <legend>Topic</legend>

          <label>
            <input type="radio" name="topic" value="lab" checked>
            Lab
          </label>

          <label>
            <input type="radio" name="topic" value="lecture">
            Lecture
          </label>
        </fieldset>

        <p class="span-all">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
        </p>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
